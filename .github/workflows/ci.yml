name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || true
      - name: Test
        run: swift test
      - name: Build app (ad-hoc signed)
        run: scripts/build_app.sh
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Hotplate-adhoc
          path: dist/*.zip
