name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          latest="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Using $latest"; sudo xcode-select -s "$latest"; swift --version
      - name: Test
        run: swift test
      - name: Build app (ad-hoc signed)
        run: scripts/build_app.sh
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Hotplate-adhoc
          path: dist/*.zip
